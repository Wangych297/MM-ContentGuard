[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-image-detection-system"
version = "0.1.0"
description = "Layered image risk detection system with independently trainable visual and semantic meme models."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "numpy>=1.24",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "timm>=1.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "transformers>=4.42",
  "uvicorn>=0.29"
]

[project.optional-dependencies]
ocr = [
  "opencv-python>=4.8",
  "easyocr>=1.7",
  "pytesseract>=0.3"
]
dev = [
  "ruff>=0.4"
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "api",
  "api.*",
  "common",
  "common.*",
  "data",
  "data.*",
  "detectors",
  "detectors.*",
  "model",
  "model.*",
  "pipeline",
  "pipeline.*",
  "semantic_model",
  "semantic_model.*",
  "services",
  "services.*"
]

[tool.ruff]
line-length = 100
target-version = "py310"
